name: Build and Push to Artifact Registry

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - "main"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"

env:
  REGISTRY_AZURE: monkimages.azurecr.io
  REGISTRY_AZURE_USER: github-ci-push
  IMAGE_NAME: monk-actions

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to move floating major tag and draft releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve tags
        id: tags
        run: |
          REF="${{ github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          case "$REF" in
            v[0-9]*.[0-9]*.[0-9]*-*)
              echo "is_release=true"     >> "$GITHUB_OUTPUT"
              echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
              echo "major=${REF%%.*}"    >> "$GITHUB_OUTPUT"
              ;;
            v[0-9]*.[0-9]*.[0-9]*)
              echo "is_release=true"     >> "$GITHUB_OUTPUT"
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "major=${REF%%.*}"    >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "is_release=false"    >> "$GITHUB_OUTPUT"
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "major="              >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Read pinned monk-ci version
        id: monkci
        run: |
          VERSION=$(cat MONK_CI_VERSION 2>/dev/null | tr -d '[:space:]' || echo "latest")
          [ -z "$VERSION" ] && VERSION="latest"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker auth
        run: echo "${{ secrets.REGISTRY_AZURE_PASSWORD }}" | docker login -u ${{ env.REGISTRY_AZURE_USER }} --password-stdin ${{ env.REGISTRY_AZURE }}

      - name: Set image refs
        run: |
          echo "IMAGE_REF=${{ env.REGISTRY_AZURE }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref }}" >> $GITHUB_ENV
          if [ "${{ steps.tags.outputs.is_release }}" = "true" ] && [ "${{ steps.tags.outputs.is_prerelease }}" = "false" ]; then
            echo "IMAGE_REF_MAJOR=${{ env.REGISTRY_AZURE }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.major }}" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker build . \
            --build-arg MONK_CI_VERSION=${{ steps.monkci.outputs.version }} \
            --tag $IMAGE_REF \
            ${IMAGE_REF_MAJOR:+--tag $IMAGE_REF_MAJOR}

      - name: Push Docker image
        run: |
          docker push $IMAGE_REF
          if [ -n "$IMAGE_REF_MAJOR" ]; then
            docker push $IMAGE_REF_MAJOR
          fi

      - name: Update floating major tag in this repo
        if: steps.tags.outputs.is_release == 'true' && steps.tags.outputs.is_prerelease == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.tags.outputs.major }}" "${GITHUB_SHA}"
          git push -f origin "${{ steps.tags.outputs.major }}"

      - name: Create GitHub Release
        if: steps.tags.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.ref }}
          prerelease: ${{ steps.tags.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
