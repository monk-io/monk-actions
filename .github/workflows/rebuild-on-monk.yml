name: Rebuild on monk-ci release

# Fired by the monk repo's release pipeline (via repository_dispatch with
# event_type=monk-ci-released) whenever a new monk-ci tag is published.
# Bumps MONK_CI_VERSION and opens a PR for review.

on:
  repository_dispatch:
    types: [monk-ci-released]
  workflow_dispatch:
    inputs:
      version:
        description: "monk-ci tag to pin (e.g. v1.24.0)"
        required: true

jobs:
  bump-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.client_payload.version || github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version supplied"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=auto/bump-monk-ci-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump MONK_CI_VERSION
        run: |
          echo "${{ steps.ver.outputs.version }}" > MONK_CI_VERSION

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: ${{ steps.ver.outputs.branch }}
          title: "Bump monk-ci to ${{ steps.ver.outputs.version }}"
          body: |
            Auto-generated by `rebuild-on-monk` in response to a `monk-ci-released`
            dispatch from the `monk` repo.

            After merging, cut a new `vX.Y.Z` tag to publish a fresh `monk-actions`
            image built against `monk-ci:${{ steps.ver.outputs.version }}`.
          commit-message: "chore: bump monk-ci to ${{ steps.ver.outputs.version }}"
