name: Rebuild on monk-ci release

# Fired by the monk repo's release pipeline (via repository_dispatch with
# event_type=monk-ci-released) whenever a new stable monk-ci tag is published.
# Rebuilds and force-pushes the floating :v1 image with the new base so
# existing capsule workflows (referencing monk-io/monk-actions/...@v1) pick
# up the new monk-ci automatically — matching the pre-split behavior where
# capsule workflows pulled monk-ci:latest directly.
#
# Intentionally does NOT touch git: no commit, no PR, no tag. The action.yml
# files keep referencing :v1; only the underlying image content changes.

on:
  repository_dispatch:
    types: [monk-ci-released]
  workflow_dispatch:
    inputs:
      monk_ci_version:
        description: "monk-ci tag to rebuild against (e.g. v1.24.0)"
        required: true

env:
  REGISTRY_AZURE: monkimages.azurecr.io
  REGISTRY_AZURE_USER: github-ci-push
  IMAGE_NAME: monk-actions

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.client_payload.version || github.event.inputs.monk_ci_version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::No monk-ci version supplied"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker auth
        run: echo "${{ secrets.REGISTRY_AZURE_PASSWORD }}" | docker login -u ${{ env.REGISTRY_AZURE_USER }} --password-stdin ${{ env.REGISTRY_AZURE }}

      - name: Build image against new monk-ci base
        run: |
          docker build . \
            --build-arg MONK_CI_VERSION=${{ steps.ver.outputs.version }} \
            --tag ${{ env.REGISTRY_AZURE }}/${{ env.IMAGE_NAME }}:v1

      - name: Push floating :v1
        run: docker push ${{ env.REGISTRY_AZURE }}/${{ env.IMAGE_NAME }}:v1
