name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Alpine's busybox is what the actions image runs the scripts with.
      - run: |
          docker run --rm -v "$PWD":/w:ro alpine:3 sh -c '
            apk add --no-cache jq >/dev/null
            cp -r /w /t && cd /t
            sh tests/image-tag.test.sh && sh tests/deploy.test.sh && sh tests/cleanup-cloud.test.sh && sh tests/json-shapes.test.sh'
