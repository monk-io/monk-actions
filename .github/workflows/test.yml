name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The actions image is Alpine 3.18: its busybox runs the scripts and its jq is 1.6. Newer jq accepts
      # syntax 1.6 rejects and treats empty input differently, so the tests run on that version, not on
      # the latest Alpine.
      - run: |
          docker run --rm -v "$PWD":/w:ro alpine:3.18 sh -c '
            apk add --no-cache jq >/dev/null
            cp -r /w /t && cd /t
            sh tests/image-tag.test.sh && sh tests/deploy.test.sh && sh tests/cleanup-cloud.test.sh && sh tests/json-shapes.test.sh && sh tests/kv-bag.test.sh && sh tests/workload-secrets.test.sh && sh tests/provision-own-cluster.test.sh'
