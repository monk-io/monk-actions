name: "Monk Capsule — Deploy"
description: "Deploy a workload to a Monk cluster. Capsule flows pass double-base64'd credentials from the fetch-metadata action; static CI/CD flows pass plain monkcode/service-token secrets."
inputs:
  # ── Capsule flows (from fetch-metadata outputs) ─────────────────────────
  monkcode-b64:
    description: "Cluster monkcode (double-base64'd; pass from fetch-metadata.outputs.monkcode)."
    required: false
  monk-jit-cli-token-b64:
    description: "JIT CLI token (double-base64'd; pass from fetch-metadata.outputs.monk_jit_cli_token)."
    required: false
  # ── Static CI/CD flows (plain repo secrets) ─────────────────────────────
  monkcode:
    description: "Cluster monkcode (plain; typically the MONKCODE repo secret). Ignored when monkcode-b64 is set."
    required: false
  service-token:
    description: "Monk service token (plain; typically the MONK_SERVICE_TOKEN repo secret). Ignored when monk-jit-cli-token-b64 is set."
    required: false
  # ── Common ──────────────────────────────────────────────────────────────
  workload:
    description: "Fully qualified workload name (e.g. <repo>/<workload>)."
    required: true
  environment-name:
    description: "Capsule environment name (typically the branch slug). Required in cloud/cluster mode; unused in static mode."
    required: false
  branch-tag:
    description: "Tag to deploy under (cloud/static mode)."
    required: false
  capsule-mode:
    description: "'cloud' (per-branch capsule cluster), 'cluster' (shared capsule cluster), or 'static' (plain CI/CD deploy to a fixed cluster)."
    required: false
    default: "cloud"
  peer-pool-tag:
    description: "Tag identifying which peers form the capsule pool (cluster mode)."
    required: false
    default: "capsule-pool"
outputs:
  preview-url:
    description: "Best-effort preview URL for the deployed workload. Empty if it could not be determined."
runs:
  using: docker
  image: docker://monkimages.azurecr.io/monk-actions:v1.0.1-rc.2
  entrypoint: /opt/monk-actions/entrypoints/deploy.sh
  env:
    MONKCODE_B64: ${{ inputs.monkcode-b64 }}
    MONK_JIT_CLI_TOKEN_B64: ${{ inputs.monk-jit-cli-token-b64 }}
    MONKCODE: ${{ inputs.monkcode }}
    MONK_SERVICE_TOKEN: ${{ inputs.service-token }}
    MONK_WORKLOAD: ${{ inputs.workload }}
    ENVIRONMENT_NAME: ${{ inputs.environment-name }}
    BRANCH_TAG: ${{ inputs.branch-tag }}
    CAPSULE_MODE: ${{ inputs.capsule-mode }}
    PEER_POOL_TAG: ${{ inputs.peer-pool-tag }}
    MONK_REPO: ${{ inputs.capsule-mode == 'cluster' && inputs.environment-name || '' }}
branding:
  icon: box
  color: purple
