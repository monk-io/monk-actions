name: "Monk Capsule — Deploy"
description: "Deploy a workload to a provisioned capsule. Consumes monkcode and service token from the fetch-metadata action."
inputs:
  monkcode-b64:
    description: "Cluster monkcode (double-base64'd; pass from fetch-metadata.outputs.monkcode)."
    required: true
  monk-jit-cli-token-b64:
    description: "JIT CLI token (double-base64'd; pass from fetch-metadata.outputs.monk_jit_cli_token)."
    required: true
  workload:
    description: "Fully qualified workload name (e.g. <repo>/<workload>)."
    required: true
  environment-name:
    description: "Capsule environment name (typically the branch slug)."
    required: true
  branch-tag:
    description: "Tag to deploy under (cloud mode)."
    required: false
  capsule-mode:
    description: "'cloud' or 'cluster'."
    required: false
    default: "cloud"
  peer-pool-tag:
    description: "Tag identifying which peers form the capsule pool (cluster mode)."
    required: false
    default: "capsule-pool"
outputs:
  preview-url:
    description: "Best-effort preview URL for the deployed workload. Empty if it could not be determined."
runs:
  using: docker
  image: docker://monkimages.azurecr.io/monk-actions:v1
  entrypoint: /opt/monk-actions/entrypoints/deploy.sh
  env:
    MONKCODE_B64: ${{ inputs.monkcode-b64 }}
    MONK_JIT_CLI_TOKEN_B64: ${{ inputs.monk-jit-cli-token-b64 }}
    MONK_WORKLOAD: ${{ inputs.workload }}
    ENVIRONMENT_NAME: ${{ inputs.environment-name }}
    BRANCH_TAG: ${{ inputs.branch-tag }}
    CAPSULE_MODE: ${{ inputs.capsule-mode }}
    PEER_POOL_TAG: ${{ inputs.peer-pool-tag }}
    MONK_REPO: ${{ inputs.capsule-mode == 'cluster' && inputs.environment-name || '' }}
branding:
  icon: box
  color: purple
